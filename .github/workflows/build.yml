name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: android-actions/setup-android@v3
      - name: Build release APK
        run: ./gradlew assembleRelease --no-daemon
      - name: Check size (budget 10 MB)
        run: |
          f=$(ls dist/*.apk | head -1); s=$(stat -c %s "$f")
          echo "APK $f = $s bytes ($(echo "scale=2; $s/1048576" | bc) MB)" | tee -a "$GITHUB_STEP_SUMMARY"
          test "$s" -le 10485760 || { echo "::error::APK is over 10 MB"; exit 1; }
      - uses: actions/upload-artifact@v4
        with: { name: wishy-release-apk, path: dist/*.apk }
